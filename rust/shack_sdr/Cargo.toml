# shack_sdr: OpenHamShack's software-defined-radio decoders, the host that
# runs them on threads of their own, the runtime codec loader and the test
# signal generators (openhamshack docs/RADIO-SDR-PLAN.md §2). Rust, with a
# Python face (shack_sdr._native) built by maturin into the shack-sdr wheel.
#
# Never `cc`, `cmake` or `bindgen` (rust/deny.toml): no C is ever compiled
# into this crate, and nothing encumbered (AAC, AMBE, IMBE) is ever linked.
# Those codecs are opened at run time from the user's own install (src/codecs).
[package]
name = "shack_sdr"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
description = "OpenHamShack SDR decoders, decoder host, codec loader and test signals"
publish = false

[lib]
name = "shack_sdr"
# cdylib: the Python module. rlib: so `cargo test` links the same code with
# no Python at all.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The Python binding. Off for `cargo test`, so the tests need no Python to
# link against; maturin and tools/test.sh turn it on.
python = ["dep:pyo3"]

[dependencies]
# abi3-py311, as ohsdigi: one build serves CPython 3.11 (Pi OS bookworm) and
# every later one, and PyO3 0.29 links the Windows build against python3.dll
# by raw-dylib, so no Windows Python is needed to cross-build.
pyo3 = { version = "0.29", optional = true, default-features = false, features = ["macros", "abi3-py311"] }
# The RTTY decoder's AFC spectrum. Pure Rust, MIT/Apache-2.0, the FFT
# ohsdigi already uses.
rustfft = "6"
# The codec loader: dlopen/LoadLibraryExW and symbol lookup. ISC. Only ever
# opens a full path the loader chose (src/codecs).
libloading = "0.8"
# Deflate for SSTV's PNGs (src/sstv/png.rs). Pure Rust, no C,
# MIT/Zlib/Apache-2.0; its one dependency, adler2, 0BSD/MIT/Apache-2.0.
miniz_oxide = "0.9"

[target.'cfg(unix)'.dependencies]
# CLOCK_THREAD_CPUTIME_ID, for the host's CPU budget (src/cpu.rs).
libc = "0.2"

[dev-dependencies]
# The RTTY tests read the committed fixtures and golden numbers
# (testdata/rtty) and check each fixture's sha256. Tests only: never in the
# library or the wheel. MIT/Apache-2.0.
serde_json = "1"
sha2 = "0.10"
