[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shack-ui"
version = "0.3.0.dev1"
description = "OpenHamShack ui/2: build server-driven screens, validate them, apply and serve their live patch ops"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Brian Henderson, GM4BRI" }]
# Standard library only at run time. The named rules (check.py) are what
# a renderer enforces and what Screen.json() runs; jsonschema checks the
# structure against spec/schemas/ui2.schema.json in the tests, where a
# hand-written walk of the whole schema would drift from it. An app whose
# own tests want the schema too installs the `test` extra.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Copies of spec/ui2/ (the symbol sets and the client's icon names), read
# at run time by shack_ui.symbols; a wheel cannot reach the repository.
# tools/gen-ui2-vectors.py refreshes them and a test fails if they differ.
shack_ui = ["data/ui2/*.json", "data/ui2/symbols/*.json"]
