[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shack-bandplan"
version = "0.2.0"
description = "OpenHamShack band plans and licence rules as data, and the transmit check every app shares"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Brian Henderson, GM4BRI" }]
dependencies = []

[project.scripts]
shack-bandplan-validate = "shack_bandplan.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The English template ships with the package so a translator, or an app
# bundling its own catalogs, starts from the sentences this exact version
# says; compiled catalogs (.mo) are what gettext loads at run time.
shack_bandplan = ["locale/*.pot", "locale/*/LC_MESSAGES/*.mo"]
